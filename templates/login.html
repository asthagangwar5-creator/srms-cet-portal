<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SRMS CET Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page-container">
    <header class="section-header">
      <h2>SRMS CET Portal Login</h2>
      <p>Sign in to manage inventory, equipment borrowing, alerts, and the AI assistant.</p>
    </header>

    <section class="card form-container">
      {% if error %}
        <p class="error-text">{{ error }}</p>
      {% endif %}

      <form method="POST" action="{{ url_for('login_page') }}">
        <div class="input-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="admin" required autocomplete="username">
        </div>

        <div class="input-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="admin123" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <p class="hint-text">Default credentials: <strong>admin</strong> / <strong>admin123</strong></p>
    </section>
  </main>
</body>
</html>
